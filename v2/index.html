                        <div className="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {CATEGORIES.map((category) => (
                                <CategoryCard key={category.name} category={category} />

                    </div>
                </section>

        // ParallaxAd Component
        const ParallaxAd = () => {
            const featuredProduct = PRODUCTS.find(p => p.id === 5);

            if (!featuredProduct) return null;

            return (
                <section 
                    className="relative min-h-screen flex items-center justify-center text-white parallax-bg bg-center bg-cover bg-no-repeat"
                    style={{ backgroundImage: "url('https://images.unsplash.com/photo-1543362906-acfc16c67564?q=80&w=1965&auto=format&fit=crop')" }}
                >
                    <div className="absolute inset-0 bg-black/60 z-10"></div>
                    
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8 relative z-20 text-center flex flex-col items-center">
                        <span className="text-sm font-bold uppercase tracking-widest text-blue-400">Feature Spotlight</span>
                        <h2 className="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight mt-2">
                            {featuredProduct.name}
                        </h2>
                        <p className="mt-4 max-w-2xl mx-auto text-lg md:text-xl text-gray-200">
                            {featuredProduct.description}
                        </p>

                        <div className="mt-10 bg-white/10 backdrop-blur-md rounded-xl p-8 border border-white/20 flex flex-col md:flex-row items-center gap-6 md:gap-10">
                            <p className="text-5xl font-bold tracking-tight">${featuredProduct.price.toFixed(2)}</p>
                            <button className="bg-blue-600 text-white hover:bg-blue-700 w-16 h-16 rounded-full flex items-center justify-center transition-all duration-300 transform hover:scale-110 shadow-lg" aria-label="Add to cart">
                                <i className="fas fa-plus text-2xl"></i>
                            </button>
                            <a href="#" className="inline-block bg-white text-gray-900 hover:bg-gray-200 font-bold px-8 py-4 rounded-md transition-all duration-300 transform hover:scale-105 text-lg">
                                Shop Now
                            </a>
                        </div>
                    </div>
                </section>
            );
        };

        // SellerCard Component
        const SellerCard = ({ product, className = '' }) => {
            return (
                <div className={`group relative rounded-2xl overflow-hidden shadow-lg ${className}`}>
                    <img
                        src={product.imageUrl}
                        alt={product.name}
                        className="absolute inset-0 w-full h-full object-cover transition-transform duration-500 ease-in-out group-hover:scale-110"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/40 to-transparent"></div>
                    <div className="relative h-full flex flex-col justify-end p-6 text-white">
                        <div>
                            <p className="text-sm uppercase tracking-wider font-medium opacity-80">{product.category}</p>
                            <h3 className="text-2xl lg:text-3xl font-bold mt-1 leading-tight">{product.name}</h3>
                        </div>
                        <div className="mt-4 flex justify-between items-center">
                            <p className="text-3xl lg:text-4xl font-extrabold tracking-tight">${product.price.toFixed(2)}</p>
                            <button 
                                className="bg-white/20 hover:bg-white/40 backdrop-blur-sm text-white w-12 h-12 rounded-full flex items-center justify-center transition-all duration-300 group-hover:scale-110"
                                aria-label={`Add ${product.name} to cart`}
                            >
                                <i className="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // TopSellers Component
        const TopSellers = () => {
            if (!TOP_SELLERS || TOP_SELLERS.length < 3) return null;

            return (
                <section className="py-20 sm:py-24 bg-white">
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">Top Sellers This Week</h2>
                            <p className="mt-4 max-w-2xl mx-auto text-lg text-gray-600">
                                Discover the products our community is loving right now.
                            </p>

                        <div className="grid grid-cols-1 md:grid-cols-3 md:grid-rows-2 gap-6 h-auto md:h-[600px]">
                            <SellerCard product={TOP_SELLERS[0]} className="md:col-span-2 md:row-span-2 min-h-[300px]" />
                            <SellerCard product={TOP_SELLERS[1]} className="md:col-span-1 min-h-[290px]" />
                            <SellerCard product={TOP_SELLERS[2]} className="md:col-span-1 min-h-[290px]" />
                        </div>
                    </div>
                </section>
            );
        };

        // FeatureCard Component
        const FeatureCard = ({ icon, title, children }) => (
            <div className="bg-gray-50 p-6 rounded-lg border border-gray-200">
                <div className="flex items-center">
                    <div className="flex-shrink-0 bg-blue-100 h-12 w-12 rounded-md flex items-center justify-center">

                    </div>
                    <h3 className="ml-4 text-xl font-bold text-gray-900">{title}</h3>
                </div>
                <p className="mt-4 text-gray-600">{children}</p>
            </div>

        // CommunityVetting Component
        const CommunityVetting = () => {
            return (
                <section id="vetting" className="py-20 sm:py-24 bg-white">
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="text-center">
                            <h2 className="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">Community Vetted. Premium Only.</h2>
                            <p className="mt-4 max-w-3xl mx-auto text-lg text-gray-600">
                                Our "compliance moat" isn't just a backend feature—it's our promise to you. We enforce strict standards to ensure only the highest quality brands and products make it onto our platform.
                            </p>
                        </div>
                        <div className="mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            <FeatureCard icon="fa-shield-halved" title="Rigorous Vetting">
                                Every vendor undergoes a multi-step verification process to ensure compliance, quality, and alignment with our community's values.
                            </FeatureCard>
                            <FeatureCard icon="fa-award" title="Premium Standards">
                                We enforce strict guidelines for product imagery, descriptions, and customer service to maintain a premium, trustworthy shopping experience.
                            </FeatureCard>
                            <FeatureCard icon="fa-users-gear" title="Community Driven">
                                Our standards are continuously refined based on feedback from our most trusted members—the Wellness Seekers and Platform Professionals.
                            </FeatureCard>
                        </div>
                        <div className="mt-16 text-center">
                            <a href="#" className="inline-block bg-transparent border-2 border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white font-bold px-8 py-3 rounded-md transition-all duration-300 transform hover:scale-105 text-lg">
                                Learn About Our Standards
                            </a>
                            <p className="mt-4 text-sm text-gray-500">We are highly selective to maintain platform integrity.</p>
                        </div>
                    </div>
                </section>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer className="bg-gray-900 text-gray-400">
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-8">

                                <h3 className="text-xl font-bold text-blue-500">Product</h3>
                                <p className="mt-2 text-sm">The ecosystem for the ambitious.</p>
                            </div>
                            <div>
                                <h4 className="font-semibold text-white">Shop</h4>
                                <ul className="mt-4 space-y-2 text-sm">
                                    <li><a href="#" className="text-gray-400 hover:text-white">Apparel</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Nutrition</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Supplements</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Accessories</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-semibold text-white">For Partners</h4>
                                <ul className="mt-4 space-y-2 text-sm">
                                    <li><a href="#" className="text-gray-400 hover:text-white">Sell on Product</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Affiliate Program</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Careers</a></li>
                                    <li><a href="#vetting" className="text-gray-400 hover:text-white">Our Standards</a></li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-semibold text-white">Legal</h4>
                                <ul className="mt-4 space-y-2 text-sm">
                                    <li><a href="#" className="text-gray-400 hover:text-white">Terms of Service</a></li>
                                    <li><a href="#" className="text-gray-400 hover:text-white">Privacy Policy</a></li>
                                </ul>
                            </div>
                        </div>
                        <div className="mt-12 pt-8 border-t border-gray-800">
                            <div className="text-center mb-6">
                                <a href="#" className="inline-flex items-center px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition-all duration-300 transform hover:scale-105">
                                    <i className="fas fa-store mr-2"></i>
                                    Sell Products In Your Store
                                </a>
                            </div>
                            <div className="flex flex-col md:flex-row justify-between items-center">
                                <p className="text-sm text-gray-500">&copy; {new Date().getFullYear()} Product. All rights reserved.</p>
                                <div className="flex space-x-6 mt-4 md:mt-0">
                                    <a href="#" className="text-gray-400 hover:text-white"><i className="fab fa-tiktok text-xl"></i></a>
                                    <a href="#" className="text-gray-400 hover:text-white"><i className="fab fa-instagram text-xl"></i></a>
                                    <a href="#" className="text-gray-400 hover:text-white"><i className="fab fa-youtube text-xl"></i></a>
                                    <a href="#" className="text-gray-400 hover:text-white"><i className="fab fa-twitter text-xl"></i></a>
                                </div>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // Main App Component
        const App = () => {
            return (
                <div className="min-h-screen bg-white font-sans">
                    <Header />
                    <main>
                        <Hero />
                        <FeaturedProducts />
                        <Products />
                        <Categories />
                        <ParallaxAd />
                        <TopSellers />
                        <CommunityVetting />
                    </main>
                    <Footer />
                </div>
            );
        };

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
