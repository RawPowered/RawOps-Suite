<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">One platform, connected workflows</title><desc id="desc">Six connected capabilities: product-aware training, contextual AI, prospecting and accounts, samples and follow-up, legal case organization, and progress measurement. An illustration based on the preserved source.</desc>
<rect width="1280" height="650" rx="16" fill="#090A0B"/>
<path d="M1040 0H1280V200" fill="#151719"/><path d="M1120 0L970 150" stroke="#73787D" stroke-width="3"/>
<text x="40" y="48" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">RAWOPS SUITE / BUILD WALKTHROUGH</text>
<text x="40" y="103" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="38" font-weight="700">One platform. Connected workflows.</text>
<text x="40" y="137" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="18">Follow the work from product knowledge to customer relationships and operational review.</text>
<path d="M40 172H398L426 200V354H40Z" fill="#151719" stroke="#373A3D"/>
<path d="M40 172H105" stroke="#D5FF3F" stroke-width="3"/>
<text x="60" y="205" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">01 / EDUCATE</text>
<text x="60" y="249" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Product-aware training</text>
<text x="60" y="286" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Prices, product details, quizzes</text>
<text x="60" y="312" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">and sales practice in one learning flow.</text><path d="M448 172H806L834 200V354H448Z" fill="#151719" stroke="#373A3D"/>
<path d="M448 172H513" stroke="#D5FF3F" stroke-width="3"/>
<text x="468" y="205" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">02 / ASSIST</text>
<text x="468" y="249" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Contextual AI tools</text>
<text x="468" y="286" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Catalog and account context for chat;</text>
<text x="468" y="312" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">lead activity for assisted email drafts.</text><path d="M856 172H1214L1242 200V354H856Z" fill="#151719" stroke="#373A3D"/>
<path d="M856 172H921" stroke="#D5FF3F" stroke-width="3"/>
<text x="876" y="205" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">03 / ACQUIRE</text>
<text x="876" y="249" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Prospecting to accounts</text>
<text x="876" y="286" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Shop discovery, lead records,</text>
<text x="876" y="312" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">digital cards and customer signup.</text><path d="M40 376H398L426 404V558H40Z" fill="#151719" stroke="#373A3D"/>
<path d="M40 376H105" stroke="#D5FF3F" stroke-width="3"/>
<text x="60" y="409" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">04 / FULFILL</text>
<text x="60" y="453" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Samples and follow-up</text>
<text x="60" y="490" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Outreach, requests, fulfillment</text>
<text x="60" y="516" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">and scheduled communication.</text><path d="M448 376H806L834 404V558H448Z" fill="#151719" stroke="#373A3D"/>
<path d="M448 376H513" stroke="#D5FF3F" stroke-width="3"/>
<text x="468" y="409" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">05 / ORGANIZE</text>
<text x="468" y="453" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Legal case workspace</text>
<text x="468" y="490" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Timelines, evidence metadata,</text>
<text x="468" y="516" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">team access and review context.</text><path d="M856 376H1214L1242 404V558H856Z" fill="#151719" stroke="#373A3D"/>
<path d="M856 376H921" stroke="#D5FF3F" stroke-width="3"/>
<text x="876" y="409" fill="#D5FF3F" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">06 / MEASURE</text>
<text x="876" y="453" fill="#F7F8F9" font-family="Arial,sans-serif" font-size="22" font-weight="700">Progress and visibility</text>
<text x="876" y="490" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">Training, active and idle time,</text>
<text x="876" y="516" fill="#B9BEC2" font-family="Arial,sans-serif" font-size="16">CRM quality and operational activity.</text><path d="M40 597H1240" stroke="#373A3D"/><text x="40" y="625" fill="#AEB3B8" font-family="Arial,sans-serif" font-size="14">Historical implementation • Genuine archived captures • Source-linked walkthrough</text></svg>
