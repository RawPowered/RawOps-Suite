<rect class="card" x="1020" y="380" width="330" height="128" rx="2"/><text x="1048" y="421" class="ct">Relational data layer</text><text x="1048" y="448" class="tx">Shared records · constraints · migrations</text><text x="1048" y="480" class="chip">MYSQL · SQL MIGRATION ARCHIVE</text>
<rect class="card" x="1020" y="550" width="330" height="142" rx="2"/><text x="1048" y="592" class="ct">External services</text><text x="1048" y="619" class="tx">Google · SendGrid · Printify · shipping</text><text x="1048" y="645" class="tx">Credentials and live status excluded</text><text x="1048" y="673" class="chip">INTEGRATION BOUNDARY</text>
</g>
<g fill="none" stroke="#73787D" stroke-width="2" marker-end="url(#arrow)" opacity=".9"><path d="M380 255h55v128h55"/><path d="M380 383h110"/><path d="M380 511h55V383h55"/><path d="M380 639h55V383h55"/><path d="M900 255h60v16h60"/><path d="M900 383h120V270"/><path d="M900 511h120V444"/><path d="M900 639h120V621"/><path d="M1185 338v36"/><path d="M1185 508v36"/></g>
<text x="80" y="764" class="foot">The diagram reflects repository structure and historical source. It does not assert current deployment or provider availability.</text><text x="80" y="790" class="chip">SOURCE MAP / PORTFOLIO EDITION</text>
