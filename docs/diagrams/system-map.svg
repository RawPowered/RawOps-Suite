<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">RawOps Suite source map</title>
<desc id="desc">A source-derived diagram connecting role-based workspaces, connected operations, data and providers.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090A0B"/><stop offset="1" stop-color="#151719"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D5FF3F"/><stop offset="1" stop-color="#D5FF3F"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#F7F8F9" flood-opacity=".09"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 10 6 1 11" fill="none" stroke="#73787D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>.title{font:700 32px Inter,Segoe UI,Arial,sans-serif;fill:#F7F8F9;letter-spacing:-.7px}.sub{font:500 15px Inter,Segoe UI,Arial,sans-serif;fill:#B9BEC2}.section{font:700 12px ui-monospace,Consolas,monospace;fill:#AEB3B8;letter-spacing:2px}.card{fill:#151719;stroke:#373A3D;stroke-width:1.3;filter:url(#shadow)}.ct{font:700 17px Inter,Segoe UI,Arial,sans-serif;fill:#F7F8F9}.tx{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#B9BEC2}.chip{font:700 10px ui-monospace,Consolas,monospace;fill:#B9BEC2;letter-spacing:.7px}.foot{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#B9BEC2}</style>
</defs>
<rect width="1440" height="860" rx="2" fill="url(#bg)"/><circle cx="1300" cy="90" r="145" fill="#151719" opacity=".48"/><circle cx="110" cy="790" r="140" fill="#151719" opacity=".55"/>
<rect x="72" y="54" width="52" height="52" rx="2" fill="#151719"/><path d="M88 90V71h11c7 0 11 4 11 10s-4 10-11 10h-4v-6h4c3 0 5-1 5-4s-2-4-5-4h-4v13z" fill="url(#accent)"/>
<text x="146" y="82" class="title">RawOps Suite</text><text x="146" y="110" class="sub">Source-derived architecture · historical code sample</text>
<text x="80" y="174" class="section">ROLE WORKSPACES</text><text x="500" y="174" class="section">CONNECTED OPERATIONS</text><text x="1030" y="174" class="section">DATA + PROVIDERS</text>
<g>
