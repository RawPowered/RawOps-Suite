<g>
<rect class="card" x="490" y="202" width="410" height="106" rx="2"/><rect x="490" y="202" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="518" y="240" class="ct">Product and inventory</text><text x="518" y="265" class="tx">Catalog · groups · pricing · stock · publishing</text><text x="518" y="289" class="chip">CATALOG → OPERATIONS</text>
<rect class="card" x="490" y="330" width="410" height="106" rx="2"/><rect x="490" y="330" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="518" y="368" class="ct">CRM and request workflows</text><text x="518" y="393" class="tx">Lead routing · requests · fulfillment · feedback</text><text x="518" y="417" class="chip">LEAD → REQUEST → HANDOFF</text>
<rect class="card" x="490" y="458" width="410" height="106" rx="2"/><rect x="490" y="458" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="518" y="496" class="ct">Order and finance</text><text x="518" y="521" class="tx">Invoices · commissions · accounting records</text><text x="518" y="545" class="chip">ORDER → COMMISSION → LEDGER</text>
<rect class="card" x="490" y="586" width="410" height="106" rx="2"/><rect x="490" y="586" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="518" y="624" class="ct">Communication and learning</text><text x="518" y="649" class="tx">Email queue · scheduled rules · training</text><text x="518" y="673" class="chip">EVENT → AUTOMATION → REVIEW</text>
