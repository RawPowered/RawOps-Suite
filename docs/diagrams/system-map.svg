<rect class="card" x="80" y="330" width="300" height="106" rx="2"/><rect x="80" y="330" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="106" y="368" class="ct">Sales workspace</text><text x="106" y="393" class="tx">CRM · pipeline · invoices · follow-up</text><text x="106" y="417" class="chip">AGENT</text>
<rect class="card" x="80" y="458" width="300" height="106" rx="2"/><rect x="80" y="458" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="106" y="496" class="ct">Customer workspace</text><text x="106" y="521" class="tx">Account · requests · order history</text><text x="106" y="545" class="chip">CUSTOMER</text>
<rect class="card" x="80" y="586" width="300" height="106" rx="2"/><rect x="80" y="586" width="6" height="106" rx="3" fill="#D5FF3F"/><text x="106" y="624" class="ct">Learning workspace</text><text x="106" y="649" class="tx">Modules · quizzes · progress · practice</text><text x="106" y="673" class="chip">TRAINEE</text>
