<title id="title">RawOps Suite systems orchestration</title>
<desc id="desc">A logical source map. Role-specific workspaces feed training, CRM, samples, orders, legal and product workflows. Shared PHP handlers, automation processors and provider adapters coordinate records and integrations. MySQL persistence and cross-cutting activity reporting support the platform. Lines group capabilities and do not represent a universal event bus or a verified runtime trace.</desc>
