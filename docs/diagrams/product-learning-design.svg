<title id="title">RawOps Suite: product knowledge across learning and marketing</title>
<desc id="desc">Product Formulator and recipe tools connect through an editorial catalog handoff. Catalog fields supply shared shortcode rendering and model context. LMS lessons, agent training and marketing templates use those values. Solid arrows show source-backed data use; a dashed arrow marks the editorial handoff whose automatic execution is unverified.</desc>
